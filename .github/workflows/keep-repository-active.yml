name: Keep Repository Active

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-repository-active:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update Keep Alive File
        run: |
          echo "Last updated: $(date -u)" > keep_alive.txt

      - name: Commit Changes
        run: |
          git add keep_alive.txt
          git diff --cached --quiet || git commit -m "Monthly repository keep-alive"

      - name: Push Changes
        run: |
          git push
